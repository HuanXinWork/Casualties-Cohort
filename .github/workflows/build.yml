name: Build & Package CasualtiesTogether

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "**.cs"
      - "**.csproj"
      - "Directory.Build.props"
      - "libs/**"
      - "references/**"
      - "scripts/package-release.ps1"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      configuration:
        description: "MSBuild 编译构型 (ReleaseFullgame / DebugFullgame)"
        required: false
        default: "ReleaseFullgame"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify Game Managed References
        id: check_refs
        shell: pwsh
        run: |
          # 支持仓库自带 references/CU_Fullgame 目录或通过环境变量注入游戏目录
          $candidates = @(
            $env:CASUALTIESTOGETHER_GAME_PATH,
            (Join-Path $env:GITHUB_WORKSPACE "CU_Fullgame"),
            (Join-Path $env:GITHUB_WORKSPACE "references\game")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $found = $null
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "CasualtiesUnknown_Data\Managed\Assembly-CSharp.dll")) {
              $found = $dir
              break
            }
          }
          if ($null -eq $found) {
            Write-Warning "未在 CI 工作区检测到游戏 Managed DLL（受版权限制未随公开仓库提交）；若在私有仓或自托管 Runner 运行，请放入 CU_Fullgame 或配置 CASUALTIESTOGETHER_GAME_PATH。"
            "has_game_refs=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "已定位游戏引用目录: $found"
            "has_game_refs=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "game_path=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build ReleaseFullgame & DebugFullgame
        if: steps.check_refs.outputs.has_game_refs == 'true'
        shell: pwsh
        run: |
          $gamePath = "${{ steps.check_refs.outputs.game_path }}"
          $cfg = "${{ github.event.inputs.configuration }}"
          if ([string]::IsNullOrWhiteSpace($cfg)) { $cfg = "ReleaseFullgame" }
          & ./scripts/package-release.ps1 -GamePath $gamePath -Configuration $cfg -IncludeDebug

      - name: Upload Build Artifacts
        if: steps.check_refs.outputs.has_game_refs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CasualtiesTogether-Packages
          path: |
            build/packages/*.zip
            build/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_refs.outputs.has_game_refs == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/packages/*.zip
            build/packages/SHA256SUMS.txt
